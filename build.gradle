plugins { id 'java-library'; id 'maven-publish' }
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies {
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'org.joml:joml:1.10.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
}
test { useJUnitPlatform() }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }

apply from: "gradle/boundaries.gradle"

tasks.register('compileLegacyClientPort', JavaCompile) {
    dependsOn 'classes'
    source = fileTree('src/testFixtures/client-port-2.1.2') { include '**/*.java' }
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('compat/client-port-2.1.2')
}
tasks.register('compileLegacyClientAdapter', JavaCompile) {
    dependsOn 'compileLegacyClientPort'
    source = fileTree('src/testFixtures/client-port-consumer') { include '**/*.java' }
    classpath = files(tasks.named('compileLegacyClientPort').flatMap { it.destinationDirectory }) + sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('compat/client-port-consumer')
}
tasks.register('verifyLegacyClientAdapter', JavaExec) {
    group = 'verification'
    dependsOn 'compileLegacyClientAdapter', 'jar'
    classpath = files(tasks.named('compileLegacyClientAdapter').flatMap { it.destinationDirectory },
        tasks.named('jar').flatMap { it.archiveFile }) + configurations.runtimeClasspath
    mainClass = 'compat.LegacyClientAdapter'
}
tasks.named('check') { dependsOn 'verifyLegacyClientAdapter' }

tasks.register('previewAnchorApiFixtureJar', Jar) {
    dependsOn 'classes'
    from(sourceSets.main.output) {
        include 'network/azusake/halo/api/v2/**'
    }
    archiveFileName = 'preview-anchor-api.jar'
    destinationDirectory = layout.buildDirectory.dir('compat')
}
tasks.register('compilePreviewProvider', JavaCompile) {
    dependsOn 'previewAnchorApiFixtureJar'
    source = fileTree('src/testFixtures/preview-provider') { include '**/*.java' }
    // Deliberately excludes host and implementation classes from the compilation classpath.
    classpath = files(tasks.named('previewAnchorApiFixtureJar').flatMap { it.archiveFile })
    destinationDirectory = layout.buildDirectory.dir('compat/preview-provider')
}
tasks.register('compilePreviewHostConsumer', JavaCompile) {
    dependsOn 'compilePreviewProvider', 'jar'
    source = fileTree('src/testFixtures/preview-host') { include '**/*.java' }
    classpath = files(tasks.named('jar').flatMap { it.archiveFile },
        tasks.named('compilePreviewProvider').flatMap { it.destinationDirectory })
    destinationDirectory = layout.buildDirectory.dir('compat/preview-host')
}
tasks.register('verifyExternalPreviewProvider', JavaExec) {
    group = 'verification'
    dependsOn 'compilePreviewHostConsumer'
    classpath = files(tasks.named('jar').flatMap { it.archiveFile },
        tasks.named('compilePreviewProvider').flatMap { it.destinationDirectory },
        tasks.named('compilePreviewHostConsumer').flatMap { it.destinationDirectory })
    mainClass = 'compat.PreviewHostConsumer'
}
tasks.named('check') { dependsOn 'verifyExternalPreviewProvider' }
